<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LiveRundown</title>

    <!-- Open Graph / social preview -->
    <meta property="og:title" content="LiveRundown">
    <meta property="og:description" content="A lightweight, real-time theatrical rundown engine designed to keep cast and production locked to the exact same cue line globally.">
    <meta property="og:image" content="https://leonampa.github.io/liverundown/preview.jpg">
    <meta property="og:url" content="https://leonampa.github.io/liverundown/">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="LiveRundown">
    <meta name="twitter:description" content="A lightweight, real-time theatrical rundown engine designed to keep cast and production locked to the exact same cue line globally.">
    <meta name="twitter:image" content="https://leonampa.github.io/liverundown/preview.jpg">

    <script>
        /** * EDIT THIS CONSTANT ONLY 
         */
        const targetURL = "https://github.com/leonampa/liverundown";

        // 1. Immediate JavaScript Redirect
        window.location.replace(targetURL);

        // 2. Fallback: Update the link in the body once the DOM loads
        window.onload = () => {
            const link = document.getElementById('manual-link');
            if (link) {
                link.href = targetURL;
                link.textContent = targetURL;
            }
        };
    </script>
    
    </head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #64748b;">
    <div style="text-align: center;">
        <p>Redirecting you to <br> 
           <a id="manual-link" style="color: #0f172a; font-weight: bold; text-decoration: none;">the destination</a>...
        </p>
    </div>
</body>
</html>
