<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GSDP — Leo Ampatzis</title>
    <meta name="description" content="GSDP: a deployment script that semi-automates Windows imaging and provisioning across multiple PCs, cutting most manual per-unit setup work.">
    <meta property="og:title" content="GSDP">
    <meta property="og:description" content="A deployment script that semi-automates Windows imaging and provisioning across multiple PCs.">
    <meta property="og:url" content="https://leonampa.github.io/gsdp/">
    <meta property="og:type" content="website">
    <script>
        /** * EDIT THIS CONSTANT ONLY 
         */
        const targetURL = "https://github.com/leonampa/gsdp-secondary";

        // 1. Immediate JavaScript Redirect
        window.location.replace(targetURL);

        // 2. Fallback: Update the link in the body once the DOM loads
        window.onload = () => {
            const link = document.getElementById('manual-link');
            if (link) {
                link.href = targetURL;
                link.textContent = targetURL;
            }
        };
    </script>
    
    </head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #64748b;">
    <div style="text-align: center;">
        <p>Redirecting you to <br> 
           <a id="manual-link" style="color: #0f172a; font-weight: bold; text-decoration: none;">the destination</a>...
        </p>
    </div>
</body>
</html>
