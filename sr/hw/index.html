<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Homework</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    touch-action: none;
  }
  #img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: none;
    touch-action: none;
    transform-origin: 0 0;
    will-change: transform;
  }
  #timestamp {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.55);
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    text-align: center;
  }
  #msg {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: rgba(255,255,255,0.6);
    font-size: 0.95rem;
    text-align: center;
    padding: 24px;
    display: none;
  }
</style>
</head>
<body>
<div id="stage">
  <img id="img" alt="Homework">
  <div id="msg"></div>
</div>
<div id="timestamp"></div>

<script>
  const RAW_BASE = "https://raw.githubusercontent.com/leonampa/leonampa.github.io/hw";
  const img = document.getElementById('img');
  const msg = document.getElementById('msg');
  const timestampEl = document.getElementById('timestamp');

  function showMsg(text) {
    msg.textContent = text;
    msg.style.display = 'block';
    img.style.display = 'none';
  }

  function formatTimestamp(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString(undefined, {
        weekday: 'short', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    } catch {
      return iso;
    }
  }

  async function load() {
    const t = Date.now();
    try {
      const metaRes = await fetch(`${RAW_BASE}/data/meta.json?t=${t}`, { cache: 'no-store' });
      if (metaRes.ok) {
        const meta = await metaRes.json();
        if (meta.updated) {
          timestampEl.textContent = 'Last updated: ' + formatTimestamp(meta.updated);
        }
      }
    } catch (e) {
      // non-fatal, timestamp just won't show
    }

    img.onload = () => {
      img.style.display = 'block';
      msg.style.display = 'none';
      resetZoom();
    };
    img.onerror = () => {
      showMsg('No homework image available yet.');
    };
    img.src = `${RAW_BASE}/data/latest.png?t=${t}`;
  }

  load();

  // --- Zoom & pan ---
  const MIN_SCALE = 1;
  const MAX_SCALE = 5;
  let scale = 1, tx = 0, ty = 0;

  function applyTransform() {
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function resetZoom() {
    scale = 1; tx = 0; ty = 0;
    applyTransform();
  }

  function zoomAt(clientX, clientY, newScale) {
    newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
    const rect = img.getBoundingClientRect();
    const cx = clientX - rect.left;
    const cy = clientY - rect.top;
    tx -= (cx / scale) * (newScale - scale);
    ty -= (cy / scale) * (newScale - scale);
    scale = newScale;
    applyTransform();
  }

  // Scroll-to-zoom (desktop / trackpad)
  const stage = document.getElementById('stage');
  stage.addEventListener('wheel', (e) => {
    if (img.style.display === 'none') return;
    e.preventDefault();
    const delta = -e.deltaY * 0.01;
    zoomAt(e.clientX, e.clientY, scale * (1 + delta));
  }, { passive: false });

  // Pinch-to-zoom and pan (touch)
  let pinchStartDist = null;
  let pinchStartScale = 1;
  let panStart = null; // {x, y, tx, ty}
  let lastTapTime = 0;

  function touchDist(t1, t2) {
    return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
  }
  function touchMid(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }

  stage.addEventListener('touchstart', (e) => {
    if (img.style.display === 'none') return;
    if (e.touches.length === 2) {
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
      panStart = null;
    } else if (e.touches.length === 1) {
      const now = Date.now();
      if (now - lastTapTime < 300) {
        resetZoom();
        lastTapTime = 0;
        return;
      }
      lastTapTime = now;
      if (scale > 1) {
        panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx, ty };
      }
    }
  }, { passive: true });

  stage.addEventListener('touchmove', (e) => {
    if (img.style.display === 'none') return;
    if (e.touches.length === 2 && pinchStartDist != null) {
      e.preventDefault();
      const dist = touchDist(e.touches[0], e.touches[1]);
      const mid = touchMid(e.touches[0], e.touches[1]);
      zoomAt(mid.x, mid.y, pinchStartScale * (dist / pinchStartDist));
    } else if (e.touches.length === 1 && panStart) {
      e.preventDefault();
      tx = panStart.tx + (e.touches[0].clientX - panStart.x);
      ty = panStart.ty + (e.touches[0].clientY - panStart.y);
      applyTransform();
    }
  }, { passive: false });

  stage.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) pinchStartDist = null;
    if (e.touches.length < 1) panStart = null;
  }, { passive: true });

  // Double-click reset (desktop)
  stage.addEventListener('dblclick', () => resetZoom());
</script>
</body>
</html>
