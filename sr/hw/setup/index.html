<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HW Broadcaster</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --accent-active: #3d73da;
    --ok: #35c07a;
    --err: #ff5c5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 48px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 8px 0 0;
    font-weight: 600;
  }
  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 8px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  label {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 14px 12px;
    font-size: 1rem;
    background: #0d0f14;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
  }
  input[type="password"]:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .file-picker {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .file-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 20px 12px;
    font-size: 1.05rem;
    font-weight: 600;
    background: #0d0f14;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .file-btn.has-file {
    border-style: solid;
    border-color: var(--accent);
    color: var(--text);
  }
  #fileInput { display: none; }
  #preview {
    width: 100%;
    border-radius: 10px;
    display: none;
    max-height: 260px;
    object-fit: contain;
    background: #000;
  }
  button.primary {
    width: 100%;
    padding: 18px 12px;
    font-size: 1.1rem;
    font-weight: 700;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  button.primary:active { background: var(--accent-active); }
  button.primary:disabled {
    background: #2a2f3a;
    color: var(--muted);
    cursor: not-allowed;
  }
  button.secondary {
    width: 100%;
    padding: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  .status {
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    display: none;
    line-height: 1.4;
  }
  .status.ok {
    display: block;
    background: rgba(53, 192, 122, 0.12);
    border: 1px solid var(--ok);
    color: var(--ok);
  }
  .status.err {
    display: block;
    background: rgba(255, 92, 92, 0.12);
    border: 1px solid var(--err);
    color: var(--err);
  }
  .status.busy {
    display: block;
    background: rgba(79, 140, 255, 0.12);
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .pat-saved {
    font-size: 0.8rem;
    color: var(--ok);
    display: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>HW Broadcaster</h1>
    <p class="sub">Upload tomorrow's calendar screenshot.</p>
  </div>

  <div class="card">
    <label for="patInput">GitHub Token</label>
    <input type="password" id="patInput" placeholder="Paste your PAT here" autocomplete="off">
    <span class="pat-saved" id="patSaved">✓ Token saved on this device</span>
  </div>

  <div class="card">
    <label>Screenshot</label>
    <div class="file-picker">
      <button type="button" class="file-btn" id="fileBtn">📷 Choose Image</button>
      <input type="file" id="fileInput" accept="image/*">
      <img id="preview" alt="preview">
    </div>
  </div>

  <button class="primary" id="uploadBtn" disabled>Upload</button>
  <div class="status" id="status"></div>

  <button class="secondary" id="clearTokenBtn">Clear saved token</button>
</div>

<script>
  const REPO = "leonampa/leonampa.github.io";
  const BRANCH = "hw";
  const IMG_PATH = "data/latest.png";
  const META_PATH = "data/meta.json";
  const API_BASE = `https://api.github.com/repos/${REPO}/contents`;

  const patInput = document.getElementById('patInput');
  const patSaved = document.getElementById('patSaved');
  const fileBtn = document.getElementById('fileBtn');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const uploadBtn = document.getElementById('uploadBtn');
  const status = document.getElementById('status');
  const clearTokenBtn = document.getElementById('clearTokenBtn');

  let selectedFile = null;

  // Load saved PAT
  const savedPat = localStorage.getItem('hw_pat');
  if (savedPat) {
    patInput.value = savedPat;
    patSaved.style.display = 'block';
  }

  patInput.addEventListener('input', () => {
    if (patInput.value.trim()) {
      localStorage.setItem('hw_pat', patInput.value.trim());
      patSaved.style.display = 'block';
    } else {
      localStorage.removeItem('hw_pat');
      patSaved.style.display = 'none';
    }
    updateUploadState();
  });

  clearTokenBtn.addEventListener('click', () => {
    localStorage.removeItem('hw_pat');
    patInput.value = '';
    patSaved.style.display = 'none';
    updateUploadState();
  });

  fileBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    selectedFile = file;
    fileBtn.textContent = `✓ ${file.name}`;
    fileBtn.classList.add('has-file');
    const reader = new FileReader();
    reader.onload = e => {
      preview.src = e.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
    updateUploadState();
  });

  function updateUploadState() {
    uploadBtn.disabled = !(selectedFile && patInput.value.trim());
  }

  function setStatus(type, msg) {
    status.className = 'status ' + type;
    status.textContent = msg;
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function getSha(path, token) {
    const res = await fetch(`${API_BASE}/${path}?ref=${BRANCH}`, {
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json'
      }
    });
    if (res.status === 200) {
      const data = await res.json();
      return data.sha;
    }
    if (res.status === 404) return null;
    const err = await res.json().catch(() => ({}));
    throw new Error(`Failed to check ${path}: ${res.status} ${err.message || ''}`);
  }

  async function putFile(path, token, contentBase64, sha, message) {
    const body = {
      message,
      content: contentBase64,
      branch: BRANCH
    };
    if (sha) body.sha = sha;

    const res = await fetch(`${API_BASE}/${path}`, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(`Failed to upload ${path}: ${res.status} ${err.message || ''}`);
    }
    return res.json();
  }

  uploadBtn.addEventListener('click', async () => {
    const token = patInput.value.trim();
    if (!selectedFile || !token) return;

    uploadBtn.disabled = true;
    setStatus('busy', 'Uploading…');

    try {
      const imgB64 = await fileToBase64(selectedFile);

      const imgSha = await getSha(IMG_PATH, token);
      await putFile(IMG_PATH, token, imgB64, imgSha, `Update HW screenshot ${new Date().toISOString()}`);

      const now = new Date();
      const meta = { updated: now.toISOString() };
      const metaB64 = btoa(JSON.stringify(meta));
      const metaSha = await getSha(META_PATH, token);
      await putFile(META_PATH, token, metaB64, metaSha, `Update HW meta ${now.toISOString()}`);

      setStatus('ok', '✓ Uploaded successfully.');
    } catch (e) {
      setStatus('err', '✗ ' + e.message);
      if (/401|403|bad credentials/i.test(e.message)) {
        localStorage.removeItem('hw_pat');
        patSaved.style.display = 'none';
      }
    } finally {
      updateUploadState();
    }
  });
</script>
</body>
</html>
